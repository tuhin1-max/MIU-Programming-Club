<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MIU Programming Club</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
    <div class="center-form-container">
        <div class="auth-card animate-fade">
            <img src="logo.png" alt="Logo" class="auth-logo">
            <h2>Member Login</h2>
            <p class="auth-sub">MIU Programming Club Management</p>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <input type="text" id="login_id" placeholder="Student ID (e.g. 2567CSE01267)" required>
                <input type="email" id="login_email" placeholder="Email Address" required>
                
                <button type="submit" class="btn btn-primary btn-full">Login to Dashboard</button>
            </form>

            <div class="auth-links">
                <a href="register.html">Don't have an account? Register</a><br>
                <a href="index.html" class="back-link">← Back to Home</a>
            </div>

            <div style="margin-top: 25px; font-size: 22px;">
                <a href="https://www.facebook.com/miuprogrammingclub" target="_blank" style="color: #3b5998; margin: 0 10px; text-decoration: none;"><i class="fab fa-facebook"></i></a>
                <a href="https://www.linkedin.com/company/miu-programming-club/posts/" target="_blank" style="color: #0077b5; margin: 0 10px; text-decoration: none;"><i class="fab fa-linkedin"></i></a>
                <a href="https://www.youtube.com/@tuhinahammed-7" target="_blank" style="color: #ff0000; margin: 0 10px; text-decoration: none;"><i class="fab fa-youtube"></i></a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
